name: ci
on:
  push:
    branches: [main, build/di06]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # No wallet keys or other secrets are used anywhere in CI. Every test uses stubs and generated throwaway keys.
      - run: npx vitest run
      - run: npm run invariant -- --seed 42 --runs 300
      - run: npm audit --audit-level=high --omit=dev
      - name: Web bundle scan
        run: node scripts/bundle-scan.js
      - name: Tracked files scan
        run: node scripts/scan-tracked.js
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v
