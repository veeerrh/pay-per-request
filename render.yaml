# Render blueprint: ONE free web service that serves the registry, all sellers and (full mode) Beacon with its dashboard.
# Secrets are never stored here: Render asks for them in its dashboard (sync: false) or generates them (OPERATOR_TOKEN).
# Use testnet wallets only, and rotate BEACON_PRIVATE_KEY and OPERATOR_TOKEN after judging.
services:
  - type: web
    name: agentmarket-public
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/render-host.js
    healthCheckPath: /gateway/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER_FULL
        value: "true"
      - key: ENABLE_ATTACK_PANEL
        value: "true"
      - key: NETWORK
        value: eip155:84532
      - key: CHAIN_ID
        value: "84532"
      - key: USDC_ADDRESS
        value: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      - key: FACILITATOR_URL
        value: https://x402.org/facilitator
      - key: RPC_URL
        value: https://sepolia.base.org
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: BEACON_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RELAY_PRIVATE_KEY
        sync: false
      - key: RELAY_GEMINI_API_KEY
        sync: false
      - key: ATLAS_GEMINI_API_KEY
        sync: false
      - key: TREMOR_GEMINI_API_KEY
        sync: false
      - key: BRIEF_GEMINI_API_KEY
        sync: false
